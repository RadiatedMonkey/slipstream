<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Slipstream Editor</title>
        <style>
            body {
                padding: 0;
                margin: 0;
                width: 100&;
                heigth: 100%;
                overflow: hidden;
            }

            canvas {
                padding: 0;
                margin: 0;

                background-color: black;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }
        </style>
    </head>

    <body id="wasm-editor">
        <canvas id="canvas"></canvas>
        <script type="module">
          import init, { WebHandle } from './pkg/mktools.js';

          async function main() {
            console.log("Initializing WebAssembly module");
            await init();

            const handle = new WebHandle();
            const canvas = document.getElementById("canvas");

            console.log("Starting web handle using canvas");
            await handle.start(canvas);
          }

          main().catch((err) => console.error("Failed to start WebAssembly module:", err));
        </script>
    </body>
</html>
