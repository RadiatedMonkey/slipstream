[package]
name = "slipstream"
description = "Editor for Mario Kart Wii files"
version = "0.1.0"
edition = "2024"
license = "Apache 2.0"
repository = "https://github.com/RadiatedMonkey/mktools"
build = "build.rs"

[features]
# Cargo cannot conditionally disable crate features depending on build profile.
# Therefore this feature will have to be manually enabled by the user.
glam-assert = ["glam/glam-assert"]

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
tracing-wasm = "0.2.1"
web-sys = "0.3.105"

wgpu = { version = "30.0.1", features = ["webgl"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "30.0.1"

[dependencies]
slipstream-ir = { path = "../slipstream-ir" }
slipstream-shared = { path = "../slipstream-shared" }

glam = { version = "0.33.7", features = ["bytemuck"] }

bytemuck = "1.25.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tree = "0.4.1"
winit = "0.30.13"
egui = "0.36.2"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image"] }
egui-phosphor = { version = "0.14.0", features = ["fill", "subset"] }
rfd = "0.17.2"
thiserror = "2.0.20"
byteorder = "1.5.0"
paste = "1.0.15"
futures = { version = "0.3.34", features = ["executor"] }
static_assertions = "1.1.0"
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
dashmap = "6.2.1"
egui_tiles = "0.17.1"
bitfield-struct = "0.13.0"
strum = { version = "0.28.0", features = ["derive"] }

[build-dependencies]
vergen-gitcl = { version = "10.0.3", features = ["build", "cargo", "rustc", "si"] }
